services:
        mysql:
                image: mysql:8.0
                container_name: aichat_mysql
                environment:
                        MYSQL_ROOT_PASSWORD: 091209
                        MYSQL_DATABASE: ai_chat_db
                ports:
                        - "3306:3306"
                volumes:
                        - mysql_data:/var/lib/mysql
                healthcheck:
                        test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
                        timeout: 20s
                        retries: 10

        chroma:
                image: chromadb/chroma:0.5.5
                container_name: aichat_chroma
                ports:
                        - "8000:8000"
                volumes:
                        - chroma_data:/chroma/chroma
                healthcheck:
                        test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
                        interval: 10s
                        timeout: 5s
                        retries: 5

        app:
                build: .
                container_name: aichat_app
                ports:
                        - "8081:8081"
                depends_on:
                        mysql:
                                condition: service_healthy
                        chroma:
                                condition: service_healthy
                environment:
                        SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ai_chat_db?useUnicode=true&characterEncoding=utf8&serverTimezone=GMT%2B8
                        SPRING_DATASOURCE_USERNAME: root
                        SPRING_DATASOURCE_PASSWORD: 091209
                        CHROMA_BASE_URL: http://chroma:8000

volumes:
        mysql_data:
        chroma_data: