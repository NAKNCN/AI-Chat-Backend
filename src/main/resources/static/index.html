<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>个人AI助手</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; }
        #chat { border:1px solid #ccc; padding:10px; height:400px; overflow-y:auto; margin-bottom:10px; }
        .user { color: blue; }
        .ai { color: green; }
        input[type="text"] { width: 80%; padding: 8px; }
        button { padding: 8px 16px; }
        .error { color: red; }
    </style>
</head>
<body>
<h2>个人AI助手 (RAG)</h2>
<div>
    <input type="text" id="username" placeholder="用户名" value="me">
    <input type="password" id="password" placeholder="密码" value="123">
    <button onclick="login()">登录</button>
    <button onclick="register()">注册</button>
    <span id="loginStatus"></span>
</div>
<div id="chat"></div>
<input type="text" id="question" placeholder="输入问题，例如：/rag 我的笔记里有什么？">
<button onclick="send()">发送</button>
<button onclick="stop()">停止</button>

<script>
    let token = '';
    let eventSource = null;

    function append(msg, cls) {
        const div = document.getElementById('chat');
        const p = document.createElement('p');
        p.className = cls;
        p.textContent = msg;
        div.appendChild(p);
        div.scrollTop = div.scrollHeight;
    }

    async function login() {
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const res = await fetch('/auth/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username, password})
        });
        const data = await res.json();
        if (data.code === 200) {
            token = data.data;
            document.getElementById('loginStatus').textContent = '已登录';
        } else {
            alert('登录失败: ' + data.message);
        }
    }

    async function register() {
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const res = await fetch('/auth/register', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username, password})
        });
        const data = await res.json();
        if (data.code === 200) {
            alert('注册成功，请登录');
        } else {
            alert('注册失败: ' + data.message);
        }
    }

    function send() {
        const question = document.getElementById('question').value.trim();
        if (!question) return;
        if (!token) {
            alert('请先登录');
            return;
        }
        append('我: ' + question, 'user');

        // 如果是 /rag 开头，使用 RAG 接口
        if (question.startsWith('/rag')) {
            fetch(`/ai/rag?question=${encodeURIComponent(question.substring(4))}`, {
                headers: {'Authorization': 'Bearer ' + token}
            })
                .then(res => res.json())
                .then(data => {
                    append('AI: ' + (data.data || data.message), 'ai');
                })
                .catch(err => append('错误: ' + err, 'error'));
        } else {
            // 流式对话
            if (eventSource) eventSource.close();
            eventSource = new EventSource('/chat/stream?token=' + token + '&question=' + encodeURIComponent(question));
            // 注意：EventSource 只支持 GET，需要调整后端以支持 GET 流式，或改用 fetch + SSE 解析。
            // 简单起见，这里演示 fetch + ReadableStream 方式：
            fetchSSE(question);
        }
        document.getElementById('question').value = '';
    }

    async function fetchSSE(question) {
        const response = await fetch('/chat/stream', {
            method: 'POST',
            headers: {
                'Authorization': 'Bearer ' + token,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({question})
        });

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let aiMsg = '';
        const aiP = document.createElement('p');
        aiP.className = 'ai';
        document.getElementById('chat').appendChild(aiP);

        while (true) {
            const {done, value} = await reader.read();
            if (done) break;
            const text = decoder.decode(value, {stream: true});
            // 简单处理 SSE 格式，可能包含 "data:" 前缀
            const lines = text.split('\n');
            for (let line of lines) {
                if (line.startsWith('data:')) {
                    const content = line.substring(5).trim();
                    aiMsg += content;
                    aiP.textContent = 'AI: ' + aiMsg;
                    document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
                }
            }
        }
    }

    function stop() {
        if (eventSource) {
            eventSource.close();
            eventSource = null;
        }
    }
</script>
</body>
</html>
